services:
  - type: web
    name: podium-rankings
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app.webapp.app:app --workers 2 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: TRIATHLON_DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: HEAD_COACH_EMAIL
        value: john.high@usatriathlon.org
